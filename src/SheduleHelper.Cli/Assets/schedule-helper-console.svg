<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Schedule Helper Console — master icon.
       Metaphors: calendar (schedule) + terminal prompt caret (console).
       Full-bleed, opaque, square corners. No shadow, no rounding baked in. -->

  <g id="core">
    <!-- calendar tabs -->
    <rect x="72" y="32" width="20" height="36" rx="10" fill="#3DDC97"/>
    <rect x="164" y="32" width="20" height="36" rx="10" fill="#3DDC97"/>
    <!-- calendar card -->
    <rect x="32" y="52" width="192" height="172" rx="18" fill="#3DDC97"/>
    <!-- header band -->
    <path d="M32 70a18 18 0 0 1 18-18h156a18 18 0 0 1 18 18v34H32z" fill="#2B3550"/>
    <!-- prompt caret -->
    <path d="M84.61 119.39 129.21 164 84.61 208.61 63.39 187.39 86.79 164 63.39 140.61z" fill="#2B3550"/>
    <!-- prompt line -->
    <rect x="146" y="151" width="58" height="26" rx="6" fill="#2B3550"/>
  </g>

  <g id="detail"/>
</svg>
